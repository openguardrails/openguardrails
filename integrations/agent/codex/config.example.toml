# OpenGuardrails for Codex — MANUAL install (add to ~/.codex/config.toml or a
# project .codex/config.toml).
#
# Prefer the plugin install (`codex plugin marketplace add …` — see README);
# this file is the manual equivalent for when you'd rather wire the hooks by
# hand or can't use the plugin system. There is no build step — each hook is a
# single zero-dependency Node ≥ 18 file under hooks/.

# --- Auto mode: remove prompts for calls an OGR runtime judges safe ----------
# Fires in the approval path, before the user prompt. allow -> runs unattended,
# block -> denied, everything else (incl. runtime unavailable) -> your prompt.
[[hooks.PermissionRequest]]
matcher = "Bash|apply_patch|Read|Edit|Write|WebFetch|mcp__.*"

  [[hooks.PermissionRequest.hooks]]
  type = "command"
  command = "node /ABSOLUTE/PATH/TO/openguardrails/integrations/agent/codex/hooks/ogr-codex-automode-hook.mjs"
  timeoutSec = 15
  statusMessage = "OpenGuardrails auto mode"

# Configure via environment (the hooks read these; export them in your shell
# profile so Codex's hook process inherits them):
#   OGR_RUNTIME_URL=https://your-ogr-runtime   # default https://openguardrails.com
#   OGR_API_KEY=ogr_…                          # required: organization API key
#   (OGR_SERVER / OGR_ENROLL_TOKEN still work as legacy aliases)
#   OGR_STATE_DIR=~/.codex/openguardrails      # auto mode's per-turn denial counters
# Identity claims (all default to "" = no assertion; the runtime then derives
# identity from the API key):
#   OGR_AGENT_ID=…  OGR_AGENT_WORKSPACE=…  OGR_AGENT_USER=…

# --- Guardrail: deny blocked calls even under bypassed approvals -------------
[[hooks.PreToolUse]]
matcher = "Bash|apply_patch|Read|Edit|Write|WebFetch|mcp__.*"

  [[hooks.PreToolUse.hooks]]
  type = "command"
  command = "node /ABSOLUTE/PATH/TO/openguardrails/integrations/agent/codex/hooks/ogr-codex-hook.mjs"
  timeoutSec = 15
  statusMessage = "OpenGuardrails guardrail"

# Guardrail degraded mode (specification/degraded-mode.md): what "no verdict"
# means. The default is open (proceed, recorded as unjudged); deployments
# gating dangerous actions opt into closed (deny until the runtime answers).
#   OGR_FAIL_MODE=open|closed
