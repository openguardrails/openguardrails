[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openguardrails-instrumentation-hermes"
version = "1.0.0"
description = "Guard a Hermes agent through the OpenGuardrails (OGR) v0.8 Runtime API — two evaluates per model call, hand-rolled over stdlib, zero dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "OpenGuardrails" }]
keywords = ["ai", "agent", "security", "guardrails", "hermes", "ogr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Deliberately empty: there is no SDK layer in v0.8 — the wire is two
# hand-rolled POSTs (src/.../wire.py) over stdlib urllib.
dependencies = []

[project.urls]
Homepage = "https://openguardrails.com"
Specification = "https://github.com/openguardrails/openguardrails/tree/main/specification"
Source = "https://github.com/openguardrails/openguardrails/tree/main/integrations/agent/hermes"

[tool.hatch.build.targets.wheel]
packages = ["src/openguardrails_instrumentation_hermes"]
