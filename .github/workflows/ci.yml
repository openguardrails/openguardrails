name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The v0.6 SDK packages and the agent/gateway plugins built on them were
  # retired in v0.7 (the API is the integration surface; plugins call it
  # directly). Their jobs return here plugin by plugin as each is rewritten
  # against the v0.7 contract — higress first, below.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Test
        run: python -m pytest

  javascript:
    # The dsh plugin (@openguardrails/dsh) — the v0.7 Recipe A reference
    # agent-direct integration, tested against a mock v0.7 runtime through
    # dsh's real tool registry and Cordis waterfalls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  higress:
    # The Higress WASM plugin ("OpenGuardrails Runtime"). Everything worth
    # testing in it — span offsets, SSE chunk boundaries, sealing the session,
    # what counts as a NEW event — is ordinary Go and runs on the host; the wasm
    # build is the compile check for the parts that only exist inside a gateway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: integrations/gateway/higress/go.sum
      - name: Test
        working-directory: integrations/gateway/higress
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt"; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Build plugin.wasm
        working-directory: integrations/gateway/higress
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o plugin.wasm .
