name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # The benchmark suite. Offline; the testpaths list lives in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Test
        run: python -m pytest

  cli:
    # The `openguardrails` command. Its tests start their own stand-ins for the model API and AIRS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci
        working-directory: cli
      - run: npm test
        working-directory: cli

  higress:
    # The Higress WASM plugin ("OpenGuardrails AIRS"). Everything worth
    # testing in it — span offsets, SSE chunk boundaries, tail-hold release
    # order, the wire to AIRS — is ordinary Go and runs on the host; the
    # wasm build is the compile check for the parts that only exist inside a
    # gateway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: integrations/gateway/higress/go.sum
      - name: Test
        working-directory: integrations/gateway/higress
        run: |
          test -z "$(gofmt -l .)" || { echo "::error::gofmt"; gofmt -l .; exit 1; }
          go vet ./...
          make test
      - name: Build plugin.wasm
        working-directory: integrations/gateway/higress
        run: GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o plugin.wasm .
