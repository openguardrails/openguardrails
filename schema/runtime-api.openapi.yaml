# OpenGuardrails Runtime API — OpenAPI 3.1 description of the normative HTTP
# binding in ../specification/runtime-api.md. The Markdown specification is
# authoritative; this document is its machine-readable projection, kept in
# lockstep with the JSON Schemas in this directory
# (guard-event.schema.json, verdict.schema.json).
openapi: 3.1.0

info:
  title: OpenGuardrails Runtime API
  version: "0.7"
  summary: The HTTP wire contract between an OGR runtime (PDP) and its integration points (PEPs).
  description: |
    The OpenGuardrails (OGR) Runtime API is the normative HTTP binding of the
    OGR contract: the API a runtime (Policy Decision Point) exposes and an
    integration point (Policy Enforcement Point, PEP) calls. There is no SDK
    layer — this API is the integration surface, and the two integration
    recipes (agent-direct and gateway) are written against it in the
    specification.

    The observed plane is LLM messages. A session is a ledger of steps: one
    step is one model call, reported as two events — `step/request` (what is
    about to be sent) and `step/response` (what came back, before the agent
    acts on it) — plus an optional `turn/end` mark closing an instruction.

    Two data paths exist. `POST /v1/evaluate` is the synchronous decision
    path: one event in, one verdict out, called while the PEP is holding an
    action. `POST /v1/ingest` is the asynchronous observation path: batches
    of events that need no synchronous decision (turn/end marks, the whole
    answer after a streamed judgment). The remaining endpoints are PEP
    liveness and health.

    All requests and responses are JSON, UTF-8,
    `Content-Type: application/json`. Field names on the wire are
    `snake_case`, exactly as in the JSON Schemas. The canonical schema
    version is `ogr_version: "0.7"`.

    Hosted reference documentation: https://openguardrails.com/api/docs/
    Normative specification:
    https://github.com/openguardrails/openguardrails/blob/main/specification/runtime-api.md
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: OpenGuardrails
    url: https://openguardrails.com

externalDocs:
  description: "Runtime API (HTTP binding) — the normative specification this document projects."
  url: https://github.com/openguardrails/openguardrails/blob/main/specification/runtime-api.md

servers:
  - url: "https://{host}"
    description: |
      Any OGR runtime deployment. Canonical endpoint paths are rooted at
      `/v1/` and MUST be joined to a single configured base URL; the base URL
      MAY include a deployment-specific prefix (the reference runtime also
      mounts the same handlers under `/api/public/ogr`, so
      `https://host/api/public/ogr/v1/evaluate` is equally valid). Clients
      MUST NOT hard-code any prefix other than the configured base URL plus
      the canonical `/v1/...` path.
    variables:
      host:
        default: ogr.example.com

security:
  - orgApiKey: []

tags:
  - name: decisions
    description: The synchronous decision path.
  - name: observations
    description: The asynchronous observation path.
  - name: liveness
    description: Integration liveness and runtime health.

paths:
  /v1/evaluate:
    post:
      tags: [decisions]
      operationId: evaluate
      summary: Judge one event and return one verdict.
      description: |
        One `GuardEvent` in, one `Verdict` out. A PEP calls this while
        holding an action: the step's request before the model call, or the
        step's response before executing what the model asked for.

        A non-partial evaluate also RECORDS the event (as if ingested);
        clients MUST NOT send the same event to `/v1/ingest` again.

        On failure (timeout, 429, 5xx, network) the PEP applies its locally
        configured fail mode per category; it MUST NOT default to allow for
        gated categories.
      parameters:
        - in: header
          name: ogr-partial
          required: false
          schema:
            type: string
            enum: ["1"]
          description: |
            Marks an interim judgment of a growing streamed answer: decide,
            answer, record nothing. Judged under the same policies,
            whitelists and fail modes as a full call — the header suppresses
            the writes, never changes the decision. The PEP MUST report the
            final answer once, whole, through `/v1/ingest` when the stream
            ends.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardEvent"
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verdict"
        "400": { $ref: "#/components/responses/InvalidEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/ingest:
    post:
      tags: [observations]
      operationId: ingest
      summary: Record a batch of events that need no synchronous decision.
      description: |
        1–100 events per request; each element validated independently.
        `results` preserves request order — order IS the pairing. There is no
        request deduplication: a client retrying a timed-out batch MAY
        produce duplicate records, which observability data tolerates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch]
              additionalProperties: false
              properties:
                batch:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: "#/components/schemas/GuardEvent"
      responses:
        "207":
          description: Per-element results, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [id, status]
                      properties:
                        id:
                          type: [string, "null"]
                          description: Runtime-assigned event_id of the accepted element, null for a rejected one.
                        status:
                          type: integer
                        error:
                          type: string
        "400": { $ref: "#/components/responses/InvalidEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/heartbeat:
    post:
      tags: [liveness]
      operationId: heartbeat
      summary: Integration liveness over the authenticated channel.
      description: |
        Lets the runtime distinguish "agent idle" from "integration went
        dark". Transport-level: a heartbeat is not a GuardEvent and carries
        no guarded action. A heartbeat MUST register a live-but-idle agent so
        fleet coverage reflects integrations that have not yet emitted an
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                integration:
                  type: string
                  description: The reporting integration and build, e.g. "ogr-higress/0.4.1".
                agent_id:
                  type: string
                interval_s:
                  type: integer
                  minimum: 1
                counters:
                  type: object
                  additionalProperties:
                    type: number
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/health:
    get:
      tags: [liveness]
      operationId: health
      security: []
      summary: Unauthenticated runtime liveness.
      responses:
        "200":
          description: The runtime can serve decisions.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
        "503":
          description: The runtime cannot serve decisions.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: error

components:
  securitySchemes:
    orgApiKey:
      type: http
      scheme: bearer
      description: |
        Organization API key (`Authorization: Bearer ogr_<key>`). The key
        proves the ORGANIZATION — the tenant boundary every asserted name is
        resolved inside — and is the identity floor: a caller asserting no
        identity fields is still fully attributable (agent derived from the
        key, sessions derived, the key's workspace).

  responses:
    InvalidEvent:
      description: Body failed schema validation.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                const: invalid_event
              details:
                type: array
                items:
                  type: string
    InvalidBody:
      description: Malformed request.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
                const: unauthorized
    RateLimited:
      description: Rate limit exhausted. Clients back off and treat a 429 on /v1/evaluate like an unreachable runtime (apply the local fail mode, never fail open on gated categories).
      content:
        application/json:
          schema:
            type: object
            required: [error, limit]
            properties:
              error:
                type: string
                const: rate_limited
              limit:
                type: integer

  schemas:
    GuardEvent:
      $ref: "./guard-event.schema.json"
    Verdict:
      $ref: "./verdict.schema.json"
